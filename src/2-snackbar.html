<!DOCTYPE html>
<html lang="uk">

<head>
  <meta charset="UTF-8" />
  <title>Promise Generator</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
    }

    .form {
      display: flex;
      flex-direction: column;
      gap: 15px;
      width: 250px;
    }

    input {
      padding: 6px;
      font-size: 14px;
      margin-top: 5px;
    }

    button {
      padding: 8px;
      font-size: 14px;
      cursor: pointer;
    }

    fieldset {
      padding: 10px;
    }
  </style>
</head>

<body>

  <form class="form">
    <label>
      Delay (ms)
      <input type="number" name="delay" required />
    </label>

    <fieldset>
      <legend>State</legend>
      <label>
        <input type="radio" name="state" value="fulfilled" required />
        Fulfilled
      </label>
      <label>
        <input type="radio" name="state" value="rejected" required />
        Rejected
      </label>
    </fieldset>

    <button type="submit">Create notification</button>
  </form>

    <script type="module" src="./js/2-snackbar.js"></script>
  </body>
</html>
